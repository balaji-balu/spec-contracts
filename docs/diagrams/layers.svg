<svg viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="arch-t" xmlns="http://www.w3.org/2000/svg"><title id="arch-t">Platform layers: UI, control, orchestration and execution, with cross-cutting evidence, observability and knowledge</title><desc>The UI layer talks only to the control layer (API, governance, registries, LLM gateway). The control layer starts the orchestration layer (reconciler, runner, verify, eval gate), which runs one action at a time in the execution layer (graph engine, loop engine and harness, skills, tools and MCP servers). Evidence and provenance, observability, and knowledge and memory cut across all layers. Tagged specs go to the plan, code and QA loop, which sends proposed spec changes back to the reconciler. Dashed boxes are still being placed in Discussion 21.</desc><style>
  :root{--bg:#FFFFFF;--surface:#FFFFFF;--band:#EEF0EC;--ink:#18211D;--ink2:#46524C;--muted:#78837D;--line:#C9D0CB;
    --sys:#2B6A8A;--sys-t:#E1EDF3;--human:#A15F12;--human-t:#F7EBDA;--agent:#6450A6;--agent-t:#ECE8F6;
    --gate:#3E4A44;--gate-t:#E5E9E6;--kb:#357652;--kb-t:#E1EFE6}
  @media (prefers-color-scheme: dark){:root{--bg:#0D1117;--surface:#1A201D;--band:#1B2220;--ink:#E3E9E5;--ink2:#B4BFB9;
    --muted:#86928C;--line:#38423D;--sys:#72B3D4;--sys-t:#1B2C35;--human:#E2A45C;--human-t:#33281A;--agent:#AA99E2;
    --agent-t:#29243A;--gate:#B0BBB5;--gate-t:#252C28;--kb:#7DC79C;--kb-t:#1C2F24}}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bg{fill:var(--bg)}
  .ag rect{fill:var(--band)} .agt{font-size:13.5px;font-weight:700;fill:var(--ink)} .ags{font-size:11px;fill:var(--muted);text-anchor:end}
  .ab rect{stroke-width:1.2} .abt{font-size:12.5px;font-weight:600;fill:var(--ink);text-anchor:middle} .abs{font-size:10.5px;fill:var(--muted);text-anchor:middle}
  .r-human rect{fill:var(--human-t);stroke:var(--human)} .r-sys rect{fill:var(--sys-t);stroke:var(--sys)}
  .r-agent rect{fill:var(--agent-t);stroke:var(--agent)} .r-gate rect{fill:var(--gate-t);stroke:var(--gate)}
  .r-kb rect{fill:var(--kb-t);stroke:var(--kb)} .r-agent .abt{font-size:12px}
  .r-exec rect{fill:var(--surface);stroke:var(--ink2);stroke-dasharray:4 3}
  .aa{fill:none;stroke:var(--ink2);stroke-width:1.3} .aa.dash{stroke-dasharray:5 4;stroke:var(--muted)}
  .al{font-size:10.5px;fill:var(--muted);text-anchor:middle} .al.st{text-anchor:start}
  .mk-sys{fill:var(--ink2)} .mk-human{fill:var(--human)} .mk-agent{fill:var(--agent)} .mk-gate{fill:var(--gate)} .mk-exec{fill:var(--muted)}
</style><rect class="bg" width="1000" height="580"/><defs><marker id="am-sys" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-sys"/></marker><marker id="am-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-human"/></marker><marker id="am-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-agent"/></marker><marker id="am-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-gate"/></marker><marker id="am-exec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-exec"/></marker></defs><g class="ag"><rect x="150" y="20" width="610" height="86" rx="14"/><text x="164" y="42" class="agt">UI layer</text></g><g class="ag"><rect x="150" y="122" width="610" height="96" rx="14"/><text x="164" y="144" class="agt">Control layer</text></g><g class="ag"><rect x="150" y="234" width="610" height="96" rx="14"/><text x="164" y="256" class="agt">Orchestration layer</text></g><g class="ag"><rect x="150" y="346" width="610" height="150" rx="14"/><text x="164" y="368" class="agt">Execution layer</text><text x="746" y="368" class="ags">one pi session per action</text></g><g class="ag"><rect x="780" y="20" width="202" height="476" rx="14"/><text x="794" y="42" class="agt">Cross-cutting</text></g><g class="ab r-human"><rect x="18" y="40" width="112" height="34" rx="17"/><text x="74.0" y="62.0" class="abt">User</text></g><g class="ab r-human"><rect x="18" y="84" width="112" height="46" rx="20"/><text x="74.0" y="105.0" class="abt">BA / Architect</text><text x="74.0" y="121.0" class="abs">approve, answer</text></g><g class="ab r-sys"><rect x="166" y="52" width="200" height="44" rx="8"/><text x="266.0" y="72.0" class="abt">UI</text><text x="266.0" y="88.0" class="abs">thin client · holds no state</text></g><text x="382" y="78" class="al st">talks only to the control plane</text><g class="ab r-sys"><rect x="166" y="154" width="140" height="50" rx="8"/><text x="236.0" y="177.0" class="abt">API</text><text x="236.0" y="193.0" class="abs">requests · commands</text></g><g class="ab r-gate"><rect x="316" y="154" width="140" height="50" rx="8"/><text x="386.0" y="177.0" class="abt">Governance</text><text x="386.0" y="193.0" class="abs">policy · identity</text></g><g class="ab r-sys"><rect x="466" y="154" width="130" height="50" rx="8"/><text x="531.0" y="177.0" class="abt">Registries</text><text x="531.0" y="193.0" class="abs">pipeline.lock.yaml</text></g><g class="ab r-sys"><rect x="606" y="154" width="140" height="50" rx="8" style="stroke-dasharray:5 4"/><text x="676.0" y="177.0" class="abt">LLM gateway</text><text x="676.0" y="193.0" class="abs">litellm · placement #21</text></g><g class="ab r-sys"><rect x="166" y="266" width="200" height="50" rx="8"/><text x="266.0" y="289.0" class="abt">Reconciler</text><text x="266.0" y="305.0" class="abs">stateless loop · git is state</text></g><g class="ab r-sys"><rect x="376" y="266" width="120" height="50" rx="8"/><text x="436.0" y="289.0" class="abt">Runner</text><text x="436.0" y="305.0" class="abs">clean workspace</text></g><g class="ab r-gate"><rect x="506" y="266" width="110" height="50" rx="8"/><text x="561.0" y="289.0" class="abt">Verify</text><text x="561.0" y="305.0" class="abs">spec-lint</text></g><g class="ab r-gate"><rect x="626" y="266" width="120" height="50" rx="8"/><text x="686.0" y="289.0" class="abt">Eval gate</text><text x="686.0" y="305.0" class="abs">LLM judge</text></g><g class="ab r-agent"><rect x="166" y="378" width="190" height="104" rx="8"/><text x="261.0" y="435.0" class="abt"></text></g><text x="261" y="398" class="abt">Graph engine</text><text x="261" y="412" class="abs">nodes = actions · edges = routes</text><path class="aa" d="M204 435 H210"/><path class="aa" d="M238 435 H244"/><path class="aa" d="M272 435 H278"/><path class="aa" d="M306 435 H312"/><path class="aa dash" d="M224 444 V465 H250"/><path class="aa dash" d="M292 444 V465 H290"/><g class="ab r-agent"><rect x="176" y="426" width="28" height="18" rx="4"/><text x="190" y="439" class="abs">I</text></g><g class="ab r-agent"><rect x="210" y="426" width="28" height="18" rx="4"/><text x="224" y="439" class="abs">RA</text></g><g class="ab r-agent"><rect x="244" y="426" width="28" height="18" rx="4"/><text x="258" y="439" class="abs">RG</text></g><g class="ab r-agent"><rect x="278" y="426" width="28" height="18" rx="4"/><text x="292" y="439" class="abs">DA</text></g><g class="ab r-agent"><rect x="312" y="426" width="28" height="18" rx="4"/><text x="326" y="439" class="abs">DG</text></g><g class="ab r-agent"><rect x="250" y="456" width="40" height="18" rx="4"/><text x="270" y="469" class="abs">DDD</text></g><g class="ab r-agent"><rect x="366" y="378" width="190" height="104" rx="8"/><text x="461.0" y="414.0" class="abt">Loop engine + harness</text><text x="461.0" y="430.0" class="abs">pi agent loop inside one action</text><text x="461.0" y="444.0" class="abs">guards · lint repair · pinned</text><text x="461.0" y="458.0" class="abs">AGENTS.md, prompts, templates</text></g><g class="ab r-agent"><rect x="566" y="378" width="180" height="104" rx="8"/><text x="656.0" y="414.0" class="abt">Skills · tools · MCP</text><text x="656.0" y="430.0" class="abs">validate_artifact · trace_link</text><text x="656.0" y="444.0" class="abs">term_lookup · kb_search</text><text x="656.0" y="458.0" class="abs">skills · MCP servers</text></g><g class="ab r-kb"><rect x="794" y="56" width="174" height="120" rx="8"/><text x="881.0" y="100.0" class="abt">Evidence + provenance</text><text x="881.0" y="116.0" class="abs">git: specs/, domain/, PRs</text><text x="881.0" y="130.0" class="abs">artifact headers</text><text x="881.0" y="144.0" class="abs">trace.yaml · tags</text></g><g class="ab r-kb"><rect x="794" y="190" width="174" height="96" rx="8"/><text x="881.0" y="229.0" class="abt">Observability</text><text x="881.0" y="245.0" class="abs">run_id on every call</text><text x="881.0" y="259.0" class="abs">cost · run.json · traces</text></g><g class="ab r-kb"><rect x="794" y="376" width="174" height="106" rx="8" style="stroke-dasharray:5 4"/><text x="881.0" y="420.0" class="abt">Knowledge + memory</text><text x="881.0" y="436.0" class="abs">org KB · constitution</text><text x="881.0" y="450.0" class="abs">KG later · placement #21</text></g><g class="ab r-exec"><rect x="470" y="516" width="290" height="50" rx="8"/><text x="615.0" y="539.0" class="abt">plan → code → QA</text><text x="615.0" y="555.0" class="abs">spec-to-code loop · consumes tagged specs</text></g><path class="aa " d="M130 57 H160" marker-end="url(#am-human)"/><path class="aa " d="M130 107 H146 V88 H160" marker-end="url(#am-human)"/><path class="aa " d="M266 96 V148" marker-end="url(#am-sys)"/><text x="272" y="126" class="al st">commands</text><path class="aa " d="M236 204 V260" marker-end="url(#am-sys)"/><text x="242" y="228" class="al st">start, approve</text><path class="aa " d="M266 316 V372" marker-end="url(#am-sys)"/><text x="272" y="340" class="al st">run action</text><path class="aa " d="M746 291 H770 V116 H788" marker-end="url(#am-sys)"/><path class="aa " d="M746 430 H788" marker-end="url(#am-agent)"/><path class="aa " d="M968 116 H974 V541 H766" marker-end="url(#am-sys)"/><text x="868" y="534" class="al ">tag SPEC-n ready</text><path class="aa dash" d="M470 552 H140 V291 H160" marker-end="url(#am-exec)"/><text x="300" y="545" class="al ">code-to-spec: proposed spec changes</text></svg>
