<rect width="960" height="36" rx="12" fill="#1F2623"/><rect y="24" width="960" height="12" fill="#1F2623"/>
<circle cx="22" cy="18" r="6" fill="#EE7C71"/><circle cx="42" cy="18" r="6" fill="#E2A45C"/><circle cx="62" cy="18" r="6" fill="#6CC58C"/>
<text class="bar" x="480" y="22" text-anchor="middle">spec-contracts · npm run demo · scripted model, no key, no cost</text>
<text class="l0" y="64"><tspan x="24"><tspan class="prompt">$</tspan></tspan><tspan x="40" class="cmd">npm run demo -w step-runner</tspan></text>
<text class="l1" y="86"><tspan x="24"></tspan><tspan x="112" class="dim">Demo: the req-analysis step on SD-RA-0001, with a scripted model (no API key, no cost).</tspan></text>
<text class="l2" y="108"><tspan x="24"><tspan class="tag">[run]</tspan></tspan><tspan x="112" class="">case SD-RA-0001-refund (seeded) · step req-analysis</tspan></text>
<text class="l3" y="130"><tspan x="24"><tspan class="tag">[context]</tspan></tspan><tspan x="112" class="">constitution v3 · AGENTS.md sha256:b6f34144e228 · skill requirements-analysis@1.0.0</tspan></text>
<text class="l4" y="152"><tspan x="24"><tspan class="tag">[model]</tspan></tspan><tspan x="112" class="">turn 2 · calls kb_search · "The intent offers another payout. Checking the refund policy."</tspan></text>
<text class="l5" y="174"><tspan x="24"><tspan class="tag">[tool←]</tspan></tspan><tspan x="112" class="">kb_get ✓ kb:finance-refund-policy@4 · Refund policy (Finance)</tspan></text>
<text class="l6" y="196"><tspan x="24"><tspan class="tag">[model]</tspan></tspan><tspan x="112" class="">turn 4 · calls write · tries to rewrite the intent, which this step does not own</tspan></text>
<text class="l7" y="218"><tspan x="24"><tspan class="tag">[guard]</tspan></tspan><tspan x="112" class="bad">blocked write specs/SPEC-9001/intent.md: this step may write only requirements-analysis.md</tspan></text>
<text class="l8" y="240"><tspan x="24"><tspan class="tag">[model]</tspan></tspan><tspan x="112" class="">turn 5 · calls edit · "Writing the finding into requirements-analysis.md."</tspan></text>
<text class="l9" y="262"><tspan x="24"><tspan class="tag">[tool←]</tspan></tspan><tspan x="112" class="">trace_link ✓ added: RAF-1 affects GOAL-2</tspan></text>
<text class="l10" y="284"><tspan x="24"><tspan class="tag">[lint]</tspan></tspan><tspan x="112" class="bad">spec-lint after attempt 1: 1 E · 1 G · 2 W</tspan></text>
<text class="l11" y="306"><tspan x="24"></tspan><tspan x="112" class="bad">E S4 requirements-analysis.md:46 RAF-1 missing required key 'proposed_resolution'</tspan></text>
<text class="l12" y="328"><tspan x="24"><tspan class="tag">[repair]</tspan></tspan><tspan x="112" class="warn">attempt 2 of 4: sending the 1 error back to the model</tspan></text>
<text class="l13" y="350"><tspan x="24"><tspan class="tag">[model]</tspan></tspan><tspan x="112" class="">turn 8 · calls edit · "Adding the missing proposed_resolution."</tspan></text>
<text class="l14" y="372"><tspan x="24"><tspan class="tag">[lint]</tspan></tspan><tspan x="112" class="good">spec-lint after attempt 2: 0 E · 1 G · 2 W · no errors</tspan></text>
<text class="l15" y="394"><tspan x="24"><tspan class="tag">[check]</tspan></tspan><tspan x="112" class="">headers unchanged · 1 action blocked · 10 model calls · $0.0000</tspan></text>
<text class="l16" y="416"><tspan x="24"></tspan><tspan x="112" class="ok">OK · attempts 2 · RAF-1: blocker, routed to a human</tspan></text>
</svg>
