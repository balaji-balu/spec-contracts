<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" width="960" height="466" role="img" aria-labelledby="t d">
<title id="t">spec-contracts demo: one agent step, guarded and linted</title>
<desc id="d">A replay of npm run demo: the requirements-analysis agent reads the intent and the refund policy, is blocked from rewriting a file it does not own, writes a finding, fails lint on a missing field, repairs it, and finishes with no errors and the finding routed to a human.</desc>
